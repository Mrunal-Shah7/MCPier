<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MCPier · Design preview v1.1</title>
<style>
:root{
  --accent:#10B981; --accent-strong:#059669; --accent-soft:rgba(16,185,129,.12); --accent-line:rgba(16,185,129,.35);
  --bg:#0a0b0d; --panel:#111317; --panel-2:#161a1f; --panel-3:#1c2128; --border:#232831; --border-2:#2d333d;
  --text:#e7e9ec; --muted:#8a93a2; --faint:#5d6573;
  --sky:#38bdf8; --sky-soft:rgba(56,189,248,.12);
  --amber:#f59e0b; --amber-soft:rgba(245,158,11,.13);
  --rose:#f43f5e; --rose-soft:rgba(244,63,94,.13);
  --violet:#a78bfa; --violet-soft:rgba(167,139,250,.13);
  --orange:#fb923c; --orange-soft:rgba(251,146,60,.13);
  --slate:#94a3b8; --slate-soft:rgba(148,163,184,.12);
  --radius:10px; --shadow:0 1px 0 rgba(255,255,255,.03) inset, 0 8px 24px rgba(0,0,0,.25);
}
[data-theme="light"]{
  --bg:#f6f7f9; --panel:#ffffff; --panel-2:#f8f9fb; --panel-3:#eef1f4; --border:#e3e7ec; --border-2:#d5dbe2;
  --text:#14181f; --muted:#5d6675; --faint:#9aa3b0; --accent-soft:rgba(16,185,129,.10);
  --shadow:0 1px 2px rgba(16,24,40,.05), 0 6px 18px rgba(16,24,40,.05);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.45 "Inter","Segoe UI Variable","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
code,pre,.mono{font-family:"Cascadia Code","JetBrains Mono",Consolas,monospace}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
/* sidebar */
.side{border-right:1px solid var(--border);background:var(--panel);padding:16px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px}
.brand-mark{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,var(--accent),#0ea5e9);display:grid;place-items:center;color:#04140e;font-weight:800;font-size:13px}
.brand b{font-size:15px} .brand small{color:var(--faint);font-size:11px;margin-left:2px}
.nav-label{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding:14px 10px 6px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--muted);cursor:pointer;position:relative}
.nav a:hover{background:var(--panel-2);color:var(--text)}
.nav a.on{background:var(--accent-soft);color:var(--text)}
.nav a.on::before{content:"";position:absolute;left:-12px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--accent)}
.nav a.on svg{color:var(--accent)}
.nav .count{margin-left:auto;font-size:11px;color:var(--faint)}
.nav .count.warn{color:var(--amber)}
svg.i{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
/* header */
.top{display:flex;align-items:center;gap:10px;padding:12px 28px;border-bottom:1px solid var(--border);background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(8px);position:sticky;top:0;z-index:5}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border:1px solid var(--border);border-radius:999px;font-size:12px;color:var(--muted);background:var(--panel)}
.top .grow{flex:1}
.wrap{max-width:1600px;padding:24px 28px 48px}
/* page head */
.ph{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.ph h1{font-size:20px;margin:0;font-weight:650;letter-spacing:-.01em}
.ph .grow{flex:1}
.crumb{color:var(--faint);font-size:12px;margin-bottom:4px}
/* buttons */
.btn{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--border-2);background:var(--panel);cursor:pointer;font-weight:550;font-size:13px;white-space:nowrap}
.btn:hover{background:var(--panel-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#04140e}
.btn.primary:hover{background:var(--accent-strong);border-color:var(--accent-strong)}
.btn.danger{background:var(--rose);border-color:var(--rose);color:#fff}
.btn.danger:hover{background:#e11d48;border-color:#e11d48}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--panel-2);color:var(--text)}
.btn.sm{height:26px;padding:0 9px;font-size:12px}
.iconbtn{width:30px;height:30px;display:grid;place-items:center;border-radius:8px;border:1px solid transparent;background:transparent;color:var(--muted);cursor:pointer}
.iconbtn:hover{background:var(--panel-2);color:var(--text)}
/* cards */
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--border)}
.card-h h3{margin:0;font-size:13px;font-weight:600}
.card-h .grow{flex:1}
.card-b{padding:14px}
.grid{display:grid;gap:16px}
.cols-main-rail{grid-template-columns:minmax(0,1fr) 340px}
.cols-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.cols-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.cols-4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:1180px){.cols-main-rail{grid-template-columns:minmax(0,1fr)}.cols-4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:760px){.app{grid-template-columns:minmax(0,1fr)}.side{display:none}.cols-2,.cols-3,.cols-4{grid-template-columns:minmax(0,1fr)}}
/* kpi */
.kpi{padding:14px;display:flex;flex-direction:column;gap:4px;position:relative;overflow:hidden}
.kpi .lbl{font-size:12px;color:var(--muted)}
.kpi .val{font-size:22px;font-weight:650;letter-spacing:-.02em}
.kpi .delta{font-size:11.5px}
.kpi .spark{position:absolute;right:10px;bottom:10px;opacity:.9}
.up{color:var(--accent)} .down{color:var(--rose)}
/* table */
table{width:100%;border-collapse:collapse}
th{font-size:11.5px;font-weight:550;color:var(--faint);text-align:left;padding:9px 12px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr:hover td{background:var(--panel-2)}
tr.sel td{background:var(--accent-soft)!important}
.num{font-variant-numeric:tabular-nums}
.right{text-align:right}
/* tiles & badges */
.tile{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none;color:#fff}
.tile.lg{width:44px;height:44px;border-radius:11px;font-size:18px}
.tile.sm{width:22px;height:22px;border-radius:6px;font-size:11px}
.namecell{display:flex;align-items:center;gap:10px;min-width:0}
.namecell b{font-weight:600}
.namecell small{display:block;color:var(--faint);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:6px;font-size:12px;font-weight:550;white-space:nowrap}
.badge .d{width:6px;height:6px;border-radius:50%;background:currentColor}
.b-green{color:var(--accent);background:var(--accent-soft)}
.b-sky{color:var(--sky);background:var(--sky-soft)}
.b-amber{color:var(--amber);background:var(--amber-soft)}
.b-rose{color:var(--rose);background:var(--rose-soft)}
.b-violet{color:var(--violet);background:var(--violet-soft)}
.b-orange{color:var(--orange);background:var(--orange-soft)}
.b-slate{color:var(--slate);background:var(--slate-soft)}
.chip{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 7px;border-radius:5px;font-size:11px;font-weight:600;letter-spacing:.02em;border:1px solid var(--border-2);color:var(--muted)}
.chip.stdio{color:var(--violet);border-color:rgba(167,139,250,.35)}
.chip.http{color:var(--sky);border-color:rgba(56,189,248,.35)}
.chip.secret{color:var(--accent);border-color:var(--accent-line);font-family:"Cascadia Code",Consolas,monospace;font-weight:500}
.edge{box-shadow:inset 3px 0 0 var(--edge,transparent)}
/* tabs */
.tabs{display:inline-flex;gap:2px;padding:3px;border:1px solid var(--border);border-radius:9px;background:var(--panel);margin-bottom:16px}
.tabs button{border:0;background:transparent;padding:6px 12px;border-radius:7px;color:var(--muted);cursor:pointer;font-weight:550;font-size:13px;display:inline-flex;gap:6px;align-items:center}
.tabs button:hover{color:var(--text)}
.tabs button.on{background:var(--panel-3);color:var(--text)}
.tabs button .n{font-size:11px;color:var(--faint)}
.seg{display:inline-flex;border:1px solid var(--border-2);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;padding:5px 11px;font-size:12.5px;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
/* forms */
label.f{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted);font-weight:550}
.in,select.in,textarea.in{height:34px;border-radius:8px;border:1px solid var(--border-2);background:var(--panel-2);color:var(--text);padding:0 10px;font:inherit;font-size:13px;outline:none;width:100%}
textarea.in{height:auto;padding:10px;font-family:"Cascadia Code",Consolas,monospace;font-size:12.5px;line-height:1.55;resize:vertical}
.in:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.row{display:flex;gap:10px;align-items:center}
.row.wrapr{flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:12px}
.muted{color:var(--muted)} .faint{color:var(--faint)} .small{font-size:12px}
.sw{width:32px;height:18px;border-radius:999px;background:var(--border-2);position:relative;flex:none;cursor:pointer;border:0}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:.15s}
.sw.on{background:var(--accent)} .sw.on::after{left:16px}
/* code */
pre.code{margin:0;background:var(--panel-2);border:1px solid var(--border);border-radius:8px;padding:12px 14px;font-size:12.5px;line-height:1.6;overflow:auto;white-space:pre}
.k{color:#7dd3fc}.s{color:#86efac}.n2{color:#fcd34d}.c{color:var(--faint)}
[data-theme="light"] .k{color:#0369a1}[data-theme="light"] .s{color:#047857}[data-theme="light"] .n2{color:#b45309}
.editor{display:grid;grid-template-columns:44px minmax(0,1fr);background:var(--panel-2);border:1px solid var(--border);border-radius:8px;overflow:hidden;font-family:"Cascadia Code",Consolas,monospace;font-size:12.5px;line-height:1.7}
.editor .ln{color:var(--faint);text-align:right;padding:10px 10px 10px 0;border-right:1px solid var(--border);user-select:none;white-space:pre}
.editor .src{padding:10px 14px;white-space:pre;overflow:auto}
.editor .bad{background:var(--rose-soft);display:inline-block;width:100%}
/* misc */
.kv{display:grid;grid-template-columns:130px minmax(0,1fr);gap:9px 12px;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--border)}
.li:last-child{border-bottom:0}
.li .grow{flex:1;min-width:0}
.clamp{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sep{height:1px;background:var(--border);margin:4px 0}
.log{font-family:"Cascadia Code",Consolas,monospace;font-size:12px;line-height:1.75;background:var(--panel-2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;max-height:300px;overflow:auto}
.log .t{color:var(--faint)} .log .src-m{color:var(--accent)} .log .src-e{color:var(--orange)} .log .src-s{color:var(--sky)}
.hint{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;border:1px solid var(--border-2);color:var(--faint);font-size:10px;cursor:help;font-weight:700}
.empty{padding:30px;text-align:center;color:var(--muted)}
.ring{--p:68;width:92px;height:92px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--panel-3) 0);display:grid;place-items:center}
.ring>div{width:72px;height:72px;border-radius:50%;background:var(--panel);display:grid;place-items:center;font-weight:700;font-size:18px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.bar{height:8px;border-radius:999px;background:var(--panel-3);overflow:hidden}
.bar>span{display:block;height:100%;border-radius:999px}
.toolrow{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--border);cursor:pointer}
.toolrow:hover{background:var(--panel-2)} .toolrow.on{background:var(--accent-soft)}
.toolrow .grow{flex:1;min-width:0}
.toolrow code{font-size:12.5px}
.err{color:var(--rose);overflow-wrap:anywhere;white-space:pre-wrap}
.banner{display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:10px;border:1px solid rgba(245,158,11,.35);background:var(--amber-soft);color:var(--amber);font-size:13px;margin-bottom:16px}
.note{font-size:12px;color:var(--faint);display:flex;gap:6px;align-items:center}
/* overlay screens */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;place-items:center;z-index:20}
.modal-bg.show{display:grid}
.modal{width:420px;max-width:92vw;background:var(--panel);border:1px solid var(--border-2);border-radius:14px;padding:20px;box-shadow:0 24px 64px rgba(0,0,0,.5)}
.modal h3{margin:0 0 8px;font-size:16px}
.center-screen{min-height:70vh;display:grid;place-items:center}
.preview-tag{position:fixed;right:14px;bottom:14px;z-index:30;font-size:11px;padding:6px 10px;border-radius:8px;background:var(--panel);border:1px solid var(--border-2);color:var(--muted)}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><div class="brand-mark">M</div><div><b>MCPier</b><small>1.1</small></div></div>
    <nav class="nav" id="nav"></nav>
  </aside>
  <div>
    <header class="top">
      <span class="pill"><span class="badge b-green" style="height:auto;padding:0;background:none"><span class="d"></span></span>Live</span>
      <span class="pill">6 servers · 5 ready</span>
      <span class="pill">1 needs sign-in</span>
      <span class="pill mono">:47800</span>
      <span class="grow"></span>
      <button class="iconbtn" id="theme" title="Toggle theme"><svg class="i" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg></button>
      <button class="btn ghost sm"><svg class="i" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>Sign out</button>
    </header>
    <main class="wrap" id="main"></main>
  </div>
</div>
<div class="modal-bg" id="modal">
  <div class="modal">
    <div class="row" style="gap:12px;align-items:flex-start">
      <div class="tile" style="background:var(--rose-soft);color:var(--rose)"><svg class="i" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg></div>
      <div><h3>Delete atlassian?</h3><div class="muted small">Stops it and removes it from MCPier. Secrets stay in Credential Manager.</div></div>
    </div>
    <div class="row" style="justify-content:flex-end;margin-top:20px"><button class="btn" data-close>Cancel</button><button class="btn danger" data-close>Delete</button></div>
  </div>
</div>
<div class="preview-tag">Design preview · fake data · letter tiles stand in for server logos</div>

<script>
const I = {
  servers:'<path d="M4 4h16v6H4zM4 14h16v6H4zM8 7h.01M8 17h.01"/>',
  tools:'<path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.5-.5-.5-2.5z"/>',
  log:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
  usage:'<path d="M3 3v18h18M7 15l4-4 3 3 5-6"/>',
  tester:'<path d="M9 3h6M10 3v6L4 20h16L14 9V3"/>',
  key:'<circle cx="8" cy="15" r="4"/><path d="M10.8 12.2 20 3M17 6l3 3M15 8l2 2"/>',
  plug:'<path d="M9 2v6M15 2v6M6 8h12v4a6 6 0 0 1-12 0zM12 18v4"/>',
  gear:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',
  plus:'<path d="M12 5v14M5 12h14"/>', dots:'<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>',
  play:'<path d="M6 4l14 8-14 8z"/>', refresh:'<path d="M21 12a9 9 0 1 1-3-6.7L21 8M21 3v5h-5"/>', stop:'<rect x="6" y="6" width="12" height="12" rx="1"/>',
  edit:'<path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>', trash:'<path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>', copy:'<rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/>',
  check:'<path d="M20 6 9 17l-5-5"/>', x:'<path d="M18 6 6 18M6 6l12 12"/>', lock:'<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
  ext:'<path d="M15 3h6v6M10 14 21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>', alert:'<path d="M12 9v4M12 17h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/>',
  screen:'<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/>', user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>'
};
const ic = (n, extra='') => `<svg class="i" viewBox="0 0 24 24" ${extra}>${I[n]}</svg>`;

const servers = [
  {name:'atlassian', desc:'Jira & Confluence', tr:'http', st:'ready', proto:'2025-11-25', tools:[21,21], up:'57m', auth:'oauth', hue:212, calls:[3,5,4,8,6,9,12], url:'https://mcp.atlassian.com/v1/mcp'},
  {name:'canva', desc:'Designs', tr:'http', st:'ready', proto:'2025-11-25', tools:[48,48], up:'2h 20m', auth:'oauth', hue:190, calls:[1,2,0,3,2,5,4], url:'https://mcp.canva.com/mcp'},
  {name:'files', desc:'mcpier-test', tr:'stdio', st:'ready', proto:'2025-11-25', tools:[14,14], up:'5h 45m', auth:'none', hue:265, calls:[9,12,7,14,10,16,18], url:'npx -y @modelcontextprotocol/server-filesystem'},

function stackedBars(){
  const days=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  const keys=['files','github','notion','atlassian','canva'];
  const data=keys.map(k=>srv(k).calls.map(v=>v*1.6));
  const W=760,H=220,pad=28,bw=46,gap=(W-pad*2-bw*7)/6;
  const tot=days.map((_,i)=>data.reduce((a,d)=>a+d[i],0)); const max=Math.max(...tot);
  let out='';
  [0,.25,.5,.75,1].forEach(f=>{const y=H-pad-(H-pad*2)*f; out+=`<line x1="${pad}" x2="${W-pad}" y1="${y}" y2="${y}" stroke="var(--border)" />`;});
  days.forEach((d,i)=>{let y=H-pad; const x=pad+i*(bw+gap);
    keys.forEach((k,j)=>{const h=(data[j][i]/max)*(H-pad*2); y-=h; out+=`<rect x="${x}" y="${y.toFixed(1)}" width="${bw}" height="${Math.max(h-1.5,0).toFixed(1)}" rx="3" fill="hsl(${srv(k).hue} 55% 50%)"/>`;});
    out+=`<text x="${x+bw/2}" y="${H-8}" fill="var(--faint)" font-size="11" text-anchor="middle">${d}</text>`;});
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block">${out}</svg><div class="legend" style="margin-top:8px">${keys.map(k=>`<span><i style="background:hsl(${srv(k).hue} 55% 50%)"></i>${k}</span>`).join('')}</div>`;
}

P.other = () => {
  const head = `<div class="ph"><h1>Sign-in & dialogs</h1></div>${tabs('other',[['signedout','Signed out'],['callback','OAuth callback'],['failed','Callback failed'],['dialog','Delete dialog'],['banner','Config banner']])}`;
  const t = state.tab.other;
  if (t==='signedout') return head + `<div class="center-screen"><div class="card" style="width:380px;text-align:center"><div class="card-b stack" style="align-items:center;padding:28px"><div class="brand-mark" style="width:44px;height:44px;font-size:18px">M</div><h3 style="margin:0">Not signed in</h3><pre class="code">mcpier open</pre></div></div></div>`;
  if (t==='callback') return head + `<div class="center-screen"><div class="card" style="width:380px;text-align:center"><div class="card-b stack" style="align-items:center;padding:28px">${tile(srv('notion'),'lg')}<div class="badge b-green" style="height:26px"><span class="d"></span>Signed in</div><h3 style="margin:0">notion is ready</h3><div class="faint small">You can close this tab.</div></div></div></div>`;
  if (t==='failed') return head + `<div class="center-screen"><div class="card" style="width:400px;text-align:center"><div class="card-b stack" style="align-items:center;padding:28px"><div class="tile lg" style="background:var(--rose-soft);color:var(--rose)">${ic('x')}</div><h3 style="margin:0">Sign-in didn't finish</h3><div class="faint small">This link is no longer valid.</div><pre class="code">mcpier auth login notion</pre></div></div></div>`;
  if (t==='dialog') return head + `<div class="center-screen"><div class="modal" style="box-shadow:var(--shadow)"><div class="row" style="gap:12px;align-items:flex-start"><div class="tile" style="background:var(--rose-soft);color:var(--rose)">${ic('trash')}</div><div><h3>Delete atlassian?</h3><div class="muted small">Stops it and removes it from MCPier. Secrets stay in Credential Manager.</div></div></div><div class="row" style="justify-content:flex-end;margin-top:20px"><button class="btn">Cancel</button><button class="btn danger">Delete</button></div></div></div>`;
  return head + `<div class="banner">${ic('alert')}<b>config.json has problems</b><span class="mono small">line 14: expected ","</span><span class="grow"></span><span class="small">Changes paused</span></div><div class="faint small">Shown on every page until the file is fixed.</div>`;
};

/* ---------- wiring ---------- */
function render(){ renderNav(); document.getElementById('main').innerHTML = P[state.page](); window.scrollTo(0,0); }
document.addEventListener('click', e => {
  const el = e.target.closest('[data-page],[data-tab],[data-tool],[data-call],[data-modal],[data-close],.seg button,.sw');
  if (!el) return;
  if (el.matches('.sw')) { el.classList.toggle('on'); e.stopPropagation(); return; }
  if (el.matches('.seg button')) { [...el.parentNode.children].forEach(b=>b.classList.remove('on')); el.classList.add('on'); return; }
  if (el.dataset.modal !== undefined) { document.getElementById('modal').classList.add('show'); return; }
  if (el.dataset.close !== undefined) { document.getElementById('modal').classList.remove('show'); return; }
  if (el.dataset.page) { state.page = el.dataset.page; render(); return; }
  if (el.dataset.tab) { const [p,t] = el.dataset.tab.split(':'); state.tab[p] = t; render(); return; }
  if (el.dataset.tool) { state.tool = el.dataset.tool; render(); return; }
  if (el.dataset.call) { state.call = +el.dataset.call; render(); return; }
});
document.getElementById('theme').onclick = () => { const h=document.documentElement; h.dataset.theme = h.dataset.theme==='dark'?'light':'dark'; };
render();
</script>
