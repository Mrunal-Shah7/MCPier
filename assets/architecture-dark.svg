<title id="title">MCPier architecture</title>
<desc id="desc">Claude Code, Claude Desktop, Codex, Cursor, VS Code and any MCP client connect to one MCPier endpoint over HTTP or the stdio bridge. MCPier connects to local stdio servers and remote Streamable HTTP servers with OAuth or header authentication.</desc>
